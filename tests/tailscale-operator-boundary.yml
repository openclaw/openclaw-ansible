---
- name: Verify Tailscale operator authority on a disposable Linux host
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    openclaw_user: openclaw-operator-test
    openclaw_home: /home/openclaw-operator-test
    other_operator_user: tailscale-other-operator-test
    openclaw_vpn_provider: tailscale
    tailscale_operator_enabled: true
    ci_test: true

  tasks:
    - name: Provision the real Tailscale package and daemon
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: tailscale-linux

    - name: Seed the sudoers policy generated by an earlier release
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ openclaw_user }}"
        owner: root
        group: root
        mode: '0440'
        content: |
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale status
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale up *
          {{ openclaw_user }} ALL=(ALL) NOPASSWD: /usr/bin/tailscale down

    - name: Default legacy sudo migration observation
      ansible.builtin.set_fact:
        legacy_sudo_migration_rejected: false

    - name: Exercise unacknowledged legacy sudo migration
      block:
        - name: Run production user setup over the legacy policy
          ansible.builtin.include_role:
            name: openclaw
            tasks_from: user
      rescue:
        - name: Record the expected explicit-migration requirement
          ansible.builtin.set_fact:
            legacy_sudo_migration_rejected: true
            legacy_sudo_migration_message: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Read the preserved legacy sudoers policy
      ansible.builtin.slurp:
        src: "/etc/sudoers.d/{{ openclaw_user }}"
      register: preserved_legacy_sudoers

    - name: Assert legacy recovery access requires explicit migration
      ansible.builtin.assert:
        that:
          - legacy_sudo_migration_rejected
          - >-
            'tailscale_legacy_sudo_migration_acknowledged=true'
            in legacy_sudo_migration_message
          - >-
            '/usr/bin/tailscale up *'
            in (preserved_legacy_sudoers.content | b64decode)
          - >-
            '/usr/bin/tailscale down'
            in (preserved_legacy_sudoers.content | b64decode)

    - name: Acknowledge migration to strict Tailscale authority
      ansible.builtin.set_fact:
        tailscale_legacy_sudo_migration_acknowledged: true

    - name: Create the account and migrate its sudoers policy
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: user

    - name: Read the migrated production sudoers policy
      ansible.builtin.slurp:
        src: "/etc/sudoers.d/{{ openclaw_user }}"
      register: migrated_openclaw_sudoers

    - name: Assert the acknowledged migration removed wildcard control
      ansible.builtin.assert:
        that:
          - >-
            '/usr/bin/tailscale up *'
            not in (migrated_openclaw_sudoers.content | b64decode)
          - >-
            '/usr/bin/tailscale down'
            not in (migrated_openclaw_sudoers.content | b64decode)

    - name: Validate the rendered production sudoers policy
      ansible.builtin.command:
        argv:
          - visudo
          - -cf
          - "/etc/sudoers.d/{{ openclaw_user }}"
      changed_when: false

    - name: Create a valid different-operator fixture account
      ansible.builtin.user:
        name: "{{ other_operator_user }}"
        system: true
        create_home: false

    - name: Clear the disposable daemon operator fixture
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --operator=
      changed_when: false

    - name: Grant operator access through the production task
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: tailscale-operator-linux

    - name: Read granted operator
      ansible.builtin.command: tailscale get operator
      register: granted_operator
      changed_when: false

    - name: Assert the requested account received operator access
      ansible.builtin.assert:
        that: granted_operator.stdout | trim == openclaw_user

    - name: Exercise daemon control as the delegated account
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ openclaw_user }}"
          - --
          - tailscale
          - set
          - --shields-up=true
      register: delegated_daemon_control
      changed_when: delegated_daemon_control.rc == 0

    - name: Restore the disposable daemon preference
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --shields-up=false
      changed_when: true

    - name: Reapply operator access for idempotency
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: tailscale-operator-linux

    - name: Assign a different existing operator fixture
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--operator={{ other_operator_user }}"
      changed_when: true

    - name: Default rejection observation
      ansible.builtin.set_fact:
        different_operator_rejected: false

    - name: Exercise the existing-operator refusal path
      block:
        - name: Attempt to replace the existing operator
          ansible.builtin.include_role:
            name: openclaw
            tasks_from: tailscale-operator-linux
      rescue:
        - name: Record the expected refusal
          ansible.builtin.set_fact:
            different_operator_rejected: true

    - name: Read operator after the refused replacement
      ansible.builtin.command: tailscale get operator
      register: operator_after_refusal
      changed_when: false

    - name: Assert different operator was rejected before mutation
      ansible.builtin.assert:
        that:
          - different_operator_rejected
          - operator_after_refusal.stdout | trim == other_operator_user

    - name: Restore the OpenClaw-owned operator fixture
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--operator={{ openclaw_user }}"
      changed_when: true

    - name: Disable operator delegation
      ansible.builtin.set_fact:
        tailscale_operator_enabled: false

    - name: Revoke OpenClaw-owned access through the production task
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: tailscale-operator-linux

    - name: Read operator after opt-out
      ansible.builtin.command: tailscale get operator
      register: operator_after_opt_out
      changed_when: false

    - name: Attempt daemon control after revocation
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ openclaw_user }}"
          - --
          - tailscale
          - set
          - --shields-up=true
      register: revoked_daemon_control
      changed_when: false
      failed_when: false

    - name: Attempt to recreate operator authority through sudo
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ openclaw_user }}"
          - --
          - sudo
          - -n
          - /usr/bin/tailscale
          - up
          - "--operator={{ openclaw_user }}"
      register: forbidden_sudo_operator_restore
      changed_when: false
      failed_when: false

    - name: Read operator after forbidden sudo attempt
      ansible.builtin.command: tailscale get operator
      register: operator_after_forbidden_sudo
      changed_when: false

    - name: Assert opt-out removed daemon authority
      ansible.builtin.assert:
        that:
          - operator_after_opt_out.stdout | trim | length == 0
          - revoked_daemon_control.rc != 0
          - forbidden_sudo_operator_restore.rc != 0
          - operator_after_forbidden_sudo.stdout | trim | length == 0

    # The unauthenticated disposable node drops its operator when tailscaled
    # restarts. Foreign-operator preservation is therefore exercised above
    # while the real daemon is running; this sequence exercises stopped-service
    # reconciliation and restoration without claiming persistence the fixture
    # cannot provide.
    - name: Restore an OpenClaw-owned stopped-daemon fixture
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--operator={{ openclaw_user }}"
      changed_when: true

    - name: Stop Tailscale before provider migration
      ansible.builtin.systemd:
        name: tailscaled
        state: stopped

    - name: Select NetBird while Tailscale is stopped
      ansible.builtin.set_fact:
        openclaw_vpn_provider: netbird

    - name: Revoke the stopped daemon's OpenClaw-owned operator
      ansible.builtin.include_role:
        name: openclaw
        tasks_from: tailscale-operator-linux

    - name: Confirm operator reconciliation restored stopped state
      ansible.builtin.command: systemctl is-active tailscaled.service
      register: tailscale_after_stopped_reconciliation
      changed_when: false
      failed_when: false

    - name: Restart Tailscale to inspect persisted operator state
      ansible.builtin.systemd:
        name: tailscaled
        state: started

    - name: Read operator after stopped-daemon revocation
      ansible.builtin.command: tailscale get operator
      register: operator_after_stopped_reconciliation
      changed_when: false

    - name: Assert stopped-daemon revocation persisted
      ansible.builtin.assert:
        that:
          - tailscale_after_stopped_reconciliation.rc != 0
          - operator_after_stopped_reconciliation.stdout | trim | length == 0

    - name: Restore OpenClaw-owned operator authority for failure-path proof
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--operator={{ openclaw_user }}"
      changed_when: true

    - name: Create the persisted NetBird profile directory
      ansible.builtin.file:
        path: /var/lib/netbird
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Seed a mismatched stopped NetBird profile
      ansible.builtin.copy:
        dest: /var/lib/netbird/default.json
        owner: root
        group: root
        mode: '0600'
        content: |
          {
            "ManagementURL": {
              "Scheme": "https",
              "Host": "127.0.0.1:1",
              "Path": ""
            }
          }

    - name: Select NetBird Cloud for the failure-path proof
      ansible.builtin.set_fact:
        openclaw_vpn_provider: netbird
        tailscale_operator_enabled: false
        netbird_management_url: ""
        netbird_setup_key: ""
        ci_test: false
        netbird_failure_after_revocation_observed: false

    - name: Exercise production authority and provisioning order
      block:
        - name: Provision the rejected replacement provider
          ansible.builtin.include_role:
            name: openclaw
            tasks_from: vpn-provision-linux
      rescue:
        - name: Record the expected post-revocation provider refusal
          ansible.builtin.set_fact:
            netbird_failure_after_revocation_observed: true
            netbird_failure_after_revocation_message: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Read operator after rejected NetBird provisioning
      ansible.builtin.command: tailscale get operator
      register: operator_after_rejected_netbird
      changed_when: false

    - name: Assert provider failure could not bypass authority revocation
      ansible.builtin.assert:
        that:
          - netbird_failure_after_revocation_observed
          - >-
            'NetBird is configured for'
            in netbird_failure_after_revocation_message
          - operator_after_rejected_netbird.stdout | trim | length == 0
