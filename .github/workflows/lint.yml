---
name: Lint

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install lint dependencies
        run: python -m pip install -r requirements-lint.txt

      - name: Run yamllint
        run: yamllint .

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lint.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: >-
          ansible-lint playbook.yml tests/docker-group-security.yml
          tests/vpn-provider-transition.yml
          tests/tailscale-operator-boundary.yml

  syntax-check:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: python -m pip install -r requirements-lint.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        run: |
          ansible-playbook playbook.yml --syntax-check
          ansible-playbook tests/docker-group-security.yml --syntax-check
          ansible-playbook tests/vpn-provider-transition.yml --syntax-check
          ansible-playbook tests/tailscale-operator-boundary.yml --syntax-check

  docker-group-security:
    name: Docker Group Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: python -m pip install -r requirements-lint.txt

      - name: Verify service-user Docker access is removed
        run: ansible-playbook tests/docker-group-security.yml

  installer-integration:
    name: Installer Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify installation, configuration, and idempotency
        run: bash tests/run-tests.sh

  vpn-provider-transition:
    name: VPN Provider Transition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: python -m pip install -r requirements-lint.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Exercise both real provider transitions
        run: ansible-playbook tests/vpn-provider-transition.yml

  tailscale-operator-boundary:
    name: Tailscale Operator Boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: python -m pip install -r requirements-lint.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Exercise real daemon operator grant and refusal
        run: ansible-playbook tests/tailscale-operator-boundary.yml
