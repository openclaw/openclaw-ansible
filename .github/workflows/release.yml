name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing
        type: boolean
        default: true
      version:
        description: Dated changelog version to verify (blank uses the latest dated section)
        type: string
        required: false

permissions: {}
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release guard
        run: python3 -B scripts/test_release_preflight.py
      - name: Validate source, changelog, signature, and exact-commit push CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CI_WORKFLOWS: lint.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VERSION" = main ]; then export VERSION=; fi
          python3 scripts/release-preflight.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate Ansible source payload
        run: |
          python -m pip install -r requirements-lint.txt
          ansible-galaxy collection install -r requirements.yml
          yamllint .
          ansible-lint playbook.yml playbooks/*.yml tests/docker-group-security.yml
          ansible-playbook playbook.yml --syntax-check
          ansible-playbook playbooks/install.yml --syntax-check
          ansible-playbook playbooks/deploy.yml --syntax-check
      - name: Freeze source archive and checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          git archive --format=tar.gz --prefix=openclaw-ansible-${VERSION}/ HEAD > "release-assets/openclaw-ansible-${VERSION}.tar.gz"
          tar -tzf "release-assets/openclaw-ansible-${VERSION}.tar.gz" > "$RUNNER_TEMP/archive-files"
          test -s "$RUNNER_TEMP/archive-files"
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: payload
      - name: Reverify immutable tag and publish exact archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/audit/tag"
          test "$(git rev-parse refs/audit/tag)" = "$TAG_OBJECT"
          test "$(git rev-parse refs/audit/tag^{})" = "$TARGET_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag refs/audit/tag
          (cd payload/release-assets && sha256sum -c SHA256SUMS)
          flags=()
          [[ "$TAG" != *-* ]] || flags+=(--prerelease --latest=false)
          gh release create "$TAG" payload/release-assets/* --verify-tag --title "$TAG" --notes-file payload/release-notes.md "${flags[@]}"
