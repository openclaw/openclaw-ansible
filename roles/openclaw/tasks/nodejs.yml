---
- name: Validate the requested NodeSource series
  ansible.builtin.assert:
    that: nodejs_version is match('^[0-9]+\.x$')
    fail_msg: "nodejs_version must name a NodeSource major series, such as 24.x."

- name: Inspect the system Node.js executable
  ansible.builtin.stat:
    path: /usr/bin/node
  register: openclaw_system_node

- name: Read the existing system Node.js version
  ansible.builtin.command: /usr/bin/node --version
  register: openclaw_existing_node_version
  changed_when: false
  check_mode: false
  when: openclaw_system_node.stat.exists

- name: Select the requested NodeSource series
  ansible.builtin.set_fact:
    openclaw_nodejs_series: "{{ nodejs_version }}"

- name: Preserve a newer installed Node.js major and its update channel
  ansible.builtin.set_fact:
    openclaw_nodejs_series: "{{ openclaw_existing_node_version.stdout.split('.')[0][1:] }}.x"
  when:
    - openclaw_system_node.stat.exists
    - openclaw_existing_node_version.stdout.split('.')[0][1:] | int > nodejs_version.split('.')[0] | int

- name: Install required packages for Node.js
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create directory for NodeSource GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add NodeSource GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | \
        gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      chmod a+r /etc/apt/keyrings/nodesource.gpg
    creates: /etc/apt/keyrings/nodesource.gpg
    executable: /bin/bash

- name: Add NodeSource repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: >
      deb [signed-by=/etc/apt/keyrings/nodesource.gpg]
      https://deb.nodesource.com/node_{{ openclaw_nodejs_series }} nodistro main
    owner: root
    group: root
    mode: '0644'
  register: openclaw_nodesource_repository

- name: Update apt cache after adding NodeSource repo
  ansible.builtin.apt:
    update_cache: true
    # A new or changed source needs an immediate refresh even when other lists are fresh.
    cache_valid_time: "{{ 0 if openclaw_nodesource_repository.changed else 3600 }}"

- name: Install Node.js
  ansible.builtin.apt:
    name: "nodejs={{ openclaw_nodejs_series | replace('.x', '.*') }}"
    state: present

- name: Check if pnpm is already installed
  ansible.builtin.command: pnpm --version
  register: pnpm_check
  failed_when: false
  changed_when: false

- name: Install pnpm globally
  ansible.builtin.command: npm install -g pnpm
  when: pnpm_check.rc != 0
  changed_when: pnpm_check.rc != 0

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify pnpm installation
  ansible.builtin.command: pnpm --version
  register: pnpm_version
  changed_when: false

- name: Display Node.js and pnpm versions
  ansible.builtin.debug:
    msg:
      - "Node.js version: {{ node_version.stdout }}"
      - "pnpm version: {{ pnpm_version.stdout }}"
