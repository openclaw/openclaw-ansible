---
# OpenClaw default variables

# CI testing mode - skips tasks that require systemd, Docker-in-Docker, or kernel access
ci_test: false

# Tailscale settings
# WARNING: Tasks using tailscale_authkey MUST set no_log: true to prevent credential exposure
tailscale_enabled: false  # Set to true to install and configure Tailscale
tailscale_authkey: ""  # Optional: set to auto-connect during installation
tailscale_authkey_timeout: "60s"  # Bound unattended joins; Tailscale otherwise waits forever
tailscale_ssh: false  # Opt in to Tailscale SSH when joining with an auth key
tailscale_operator_enabled: false  # Opt in to let openclaw manage Tailscale and Serve
# Existing installs must explicitly acknowledge removal of the old wildcard
# passwordless `tailscale up` and `tailscale down` recovery commands.
tailscale_legacy_sudo_migration_acknowledged: false

# VPN provider selection. Leave empty to preserve the legacy tailscale_enabled
# behavior, or select exactly one supported provider.
vpn_provider: ""  # "tailscale", "netbird", or ""

# NetBird settings
# WARNING: Tasks using netbird_setup_key MUST set no_log: true
netbird_setup_key: ""  # Optional: auto-connect during installation
netbird_management_url: ""  # Empty selects NetBird Cloud; otherwise self-hosted URL
netbird_connect_timeout: 60  # Seconds before an unattended join is stopped
# NetBird's published Debian repository key. Keep the fingerprint pinned so a
# valid but substituted OpenPGP key cannot become an APT trust root.
netbird_repository_key_url: https://pkgs.netbird.io/debian/public.key
netbird_repository_signing_key_fingerprint: EFE37DF047DF7CCDF1FC54FA83F79AD029778355

# Node.js version
nodejs_version: "22.x"

# OpenClaw settings
openclaw_port: 3000

# OpenClaw config directory
openclaw_config_dir: "{{ openclaw_home }}/.openclaw"

# User settings (will be created as system user)
openclaw_user: openclaw
openclaw_home: /home/openclaw

# Installation mode: 'release' or 'development'
# release: Install via pnpm install -g openclaw@latest
# development: Clone repo, build from source, link globally
openclaw_install_mode: "release"

# Development mode settings (only used when openclaw_install_mode: development)
openclaw_repo_url: "https://github.com/openclaw/openclaw.git"
openclaw_repo_branch: "main"
openclaw_code_dir: "{{ openclaw_home }}/code"
openclaw_repo_dir: "{{ openclaw_code_dir }}/openclaw"

# SSH keys for openclaw user
# Add your public SSH keys here to allow SSH access as openclaw user
# Example:
#   openclaw_ssh_keys:
#     - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx user@host"
#     - "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDxxxxxxxxxxxxxxxxxxxxxxx user@host"
openclaw_ssh_keys: []
